media:
  - name: images
    label: Images
    input: public/images
    output: /images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif, gif]
  - name: videos
    label: Videos
    input: public/videos
    output: /videos
    rename: safe
    extensions: [mp4, webm]
  - name: models
    label: 3D models
    input: public/models
    output: /models
    rename: safe
    extensions: [glb, stl]

components:
  mediaItems:
    type: block
    list:
      collapsible:
        collapsed: true
        summary: "{name}"
    blockKey: type
    blocks:
      - name: image
        label: Image
        fields:
          - name: name
            label: Caption / filename
            type: string
            required: true
          - name: shape
            type: select
            required: true
            options:
              values: [portrait, landscape, square]
          - name: file
            label: Image
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: Image description
            type: string
            required: true
          - name: widths
            label: Original CDN variant widths
            description: Retained for existing CDN images; leave empty for uploads.
            type: number
            list: true
          - name: full
            label: Original CDN image width
            description: Retained for existing CDN images; leave empty for uploads.
            type: number
      - name: video
        label: Video
        fields:
          - name: name
            label: Caption / filename
            type: string
            required: true
          - name: shape
            type: select
            required: true
            options:
              values: [portrait, landscape, square]
          - name: src
            label: Upload video
            type: file
            options:
              media: videos
          - name: id
            label: Original CDN video ID
            description: Used for existing videos; an uploaded video takes priority.
            type: string

  photoItems:
    type: block
    list:
      collapsible:
        collapsed: true
        summary: "{name}"
    blockKey: type
    blocks:
      - name: image
        label: Image
        fields:
          - { name: name, label: Caption / filename, type: string, required: true }
          - { name: hidden, label: Hide from gallery, type: boolean }
          - name: shape
            type: select
            required: true
            options: { values: [portrait, landscape, square] }
          - name: file
            label: Image
            type: image
            required: true
            options: { media: images }
          - { name: alt, label: Image description, type: string, required: true }
          - name: widths
            label: Original CDN variant widths
            description: Retained for existing CDN images; leave empty for uploads.
            type: number
            list: true
          - name: full
            label: Original CDN image width
            description: Retained for existing CDN images; leave empty for uploads.
            type: number
      - name: video
        label: Video
        fields:
          - { name: name, label: Caption / filename, type: string, required: true }
          - { name: hidden, label: Hide from gallery, type: boolean }
          - name: shape
            type: select
            required: true
            options: { values: [portrait, landscape, square] }
          - name: src
            label: Upload video
            type: file
            options: { media: videos }
          - name: id
            label: Original CDN video ID
            description: Used for existing videos; an uploaded video takes priority.
            type: string

content:
  - name: background
    label: ASCII background
    type: file
    path: src/data/background.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - { name: enabled, label: Show background animation, type: boolean }
      - name: model
        label: 3D model
        description: Upload a self-contained GLB or STL. Meshopt is supported; Draco and KTX2 compression are not. Leave empty for the built-in shape.
        type: file
        options: { media: models, extensions: [glb, stl] }
      - name: color
        label: Character colour
        description: Hex colour such as #999999.
        type: string
        pattern: "^#[0-9a-fA-F]{6}$"
      - name: backgroundColor
        label: Background colour
        description: Optional hex colour; leave empty for the site's default background.
        type: string
        pattern: "^$|^#[0-9a-fA-F]{6}$"
      - name: opacity
        label: Opacity
        description: 0 is invisible; 1 is fully opaque.
        type: number
        options: { min: 0, max: 1 }
      - name: fontSize
        label: Character size
        description: Smaller characters add detail but need more processing.
        type: number
        options: { min: 6, max: 24 }
      - name: characters
        label: ASCII characters
        description: Ordered from lightest to darkest; spaces at the start leave dark areas empty.
        type: string
      - { name: invert, label: Invert shading, type: boolean }
      - { name: wireframe, label: Wireframe effect, type: boolean }
      - { name: playModelAnimation, label: Play animations embedded in GLB models, type: boolean }
      - name: animationClip
        label: GLB animation clip name
        description: Optional; leave blank to play the first clip. Names must match the model exactly.
        type: string
      - name: animationSpeed
        label: GLB animation speed
        description: 1 is normal speed; 0 pauses embedded animations.
        type: number
        options: { min: 0, max: 3 }
      - name: lightIntensity
        label: Directional light intensity
        type: number
        options: { min: 0, max: 5 }
      - name: ambientIntensity
        label: Ambient light intensity
        type: number
        options: { min: 0, max: 5 }
      - name: scale
        label: Model size
        type: number
        options: { min: 0.25, max: 3 }
      - name: offsetX
        label: Horizontal position
        description: Negative moves left; positive moves right.
        type: number
        options: { min: -3, max: 3 }
      - name: offsetY
        label: Vertical position
        description: Negative moves down; positive moves up.
        type: number
        options: { min: -3, max: 3 }
      - name: rotationX
        label: Rotation speed — X axis
        description: Radians per second; negative values reverse direction, zero stops rotation.
        type: number
        options: { min: -3, max: 3 }
      - name: rotationY
        label: Rotation speed — Y axis
        type: number
        options: { min: -3, max: 3 }
      - name: rotationZ
        label: Rotation speed — Z axis
        type: number
        options: { min: -3, max: 3 }
      - name: tiltX
        label: Starting tilt — X axis
        description: Angle in radians.
        type: number
        options: { min: -3.14, max: 3.14 }
      - name: tiltY
        label: Starting tilt — Y axis
        type: number
        options: { min: -3.14, max: 3.14 }

  - name: site
    label: Homepage and About introductions
    type: file
    path: src/data/site.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: heroTitle
        label: Homepage headline
        type: text
        required: true
      - name: aboutIntro
        label: About page introduction
        type: text
        required: true

  - name: projects
    label: Homepage projects
    type: file
    path: src/data/projects.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: items
        label: Projects (in display order)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: category, label: Category, type: string, required: true }
          - { name: year, label: Year, type: string, required: true }
          - { name: description, label: Description, type: text, required: true }
          - name: credits
            label: Credits
            type: object
            list: true
            fields:
              - { name: label, label: Role, type: string, required: true }
              - name: parts
                label: Names and links
                type: object
                list: true
                fields:
                  - { name: text, label: Text, type: string, required: true }
                  - { name: href, label: Link URL, type: string }
          - name: media
            label: Project images and videos
            component: mediaItems

  - name: photos
    label: Photos page
    type: file
    path: src/data/photos.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - { name: intro, label: Introduction, type: text, required: true }
      - name: items
        label: Gallery (in display order)
        component: photoItems

  - name: about
    label: About page
    type: file
    path: src/data/about.json
    format: json
    operations: { create: false, delete: false }
    fields:
      - name: sections
        label: Text sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Heading, type: string, required: true }
          - name: content
            label: Text and links (in display order)
            type: block
            list: true
            blockKey: type
            blocks:
              - name: text
                label: Text
                fields:
                  - { name: value, label: Text, type: text, required: true }
              - name: link
                label: Link
                fields:
                  - { name: text, label: Link text, type: string, required: true }
                  - { name: href, label: Link URL, type: string, required: true }
                  - { name: external, label: Open in a new tab, type: boolean }
              - name: break
                label: Line break
                fields: []
      - name: images
        label: Image stack
        description: Replace the existing four images or video; keep their position IDs unchanged.
        type: block
        list:
          max: 4
          collapsible: true
        blockKey: type
        blocks:
          - name: image
            label: Image
            fields:
              - { name: key, label: Position ID, type: string, required: true }
              - name: src
                label: Image
                type: image
                required: true
                options: { media: images }
          - name: video
            label: Video
            fields:
              - { name: key, label: Position ID, type: string, required: true }
              - name: src
                label: Upload video
                type: file
                options: { media: videos }
              - { name: id, label: Original CDN video ID, type: string }
